name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES="docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            {
              echo "## ${TAG} · AI 心流"
              echo
              echo "### 变更"
              echo
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s' "${PREV}..${TAG}"
              else
                git log --no-merges --pretty='- %s' "${TAG}"
              fi
            } > release-notes.md
            NOTES=release-notes.md
          fi

          ASSETS=(
            "dist/dsh-ai-mind-${VERSION}-fnos-release.zip"
            "dist/dsh-ai-mind-${VERSION}.tgz"
            "dist/SHA256SUMS"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "${TAG} · AI 心流" --notes-file "$NOTES"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "${TAG} · AI 心流" \
              --notes-file "$NOTES" \
              "${ASSETS[@]}"
          fi
